header:
  version: 18

machine: rg35xx-sp
distro: senkos
target: senkos-image

repos:
  # BSP: the H700 and Anbernic's boards
  meta-anbernic:
    path: meta-anbernic
  # Distro: SenkOS
  meta-senkos:
    path: meta-senkos
  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    layers:
      .: disabled
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    layers:
      meta:
  # The games' platform: the SDL2 family, libmodplug, opusfile; PipeWire
  # (meta-python: meta-multimedia needs it)
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:
      meta-multimedia:
      meta-python:
  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    branch: wrynose
    layers:
      meta-arm:
      meta-arm-toolchain:

local_conf_header:
  senkos: |
    INHERIT += "rm_work"
    # build dirs live on /mnt/multimedia (see ./kas); rm_work still keeps them small
    BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},2G,100K STOPTASKS,${DL_DIR},2G,100K HALT,${TMPDIR},500M,10K"
    # 31 GB: four of the big C++ cores (Flycast, PPSSPP, ...) at -j16 each ran the host out of memory
    BB_NUMBER_THREADS = "6"
    PARALLEL_MAKE = "-j 10"
