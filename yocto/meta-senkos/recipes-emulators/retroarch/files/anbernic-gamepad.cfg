# The built-in pad (anbernic-gamepad): the same buttons on every board, numbered in key code
# order (BTN_SOUTH EAST NORTH WEST TL TR TL2 TR2 SELECT START MODE THUMBL THUMBR, DPAD_UP DOWN
# LEFT RIGHT), axes X Y RX RY where there are sticks. RetroPad by label: A is the east one.
# Menu (BTN_MODE) is the launcher's: it pauses the app.
input_driver = "udev"
input_device = "Anbernic Gamepad"
input_device_display_name = "Built-in pad"
input_a_btn = "1"
input_b_btn = "0"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_l3_btn = "11"
input_r3_btn = "12"
input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"
# Hold Select: X menu, L1 load state, R1 save state, R2 fast forward
input_enable_hotkey_btn = "8"
input_menu_toggle_btn = "2"
input_load_state_btn = "4"
input_save_state_btn = "5"
input_toggle_fast_forward_btn = "7"
