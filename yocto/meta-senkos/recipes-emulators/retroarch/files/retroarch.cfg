# Handheld defaults, copied to $XDG_CONFIG_HOME/retroarch/retroarch.cfg on the first start; change
# that one (or delete it to start over). ":" is the folder RetroArch runs from.
video_driver = "gl"
video_fullscreen = "true"
video_vsync = "true"
input_driver = "wayland"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
audio_driver = "pipewire"
menu_driver = "ozone"
# Confirm with A (the east button, as printed), back with B
menu_swap_ok_cancel_buttons = "true"
config_save_on_exit = "true"

assets_directory = ":/assets"
libretro_info_path = ":/info"
joypad_autoconfig_dir = ":/autoconfig"
# The image's cores; saves and states shared with its own frontend (a folder per core)
libretro_directory = "/usr/lib64/libretro"
system_directory = "/data/OS/assets/emulator"
savefile_directory = "/data/OS/saves"
savestate_directory = "/data/OS/saves"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"
screenshot_directory = "/data/OS/screenshots"
rgui_browser_directory = "/data/roms"
input_exit_emulator_btn = "nul"
