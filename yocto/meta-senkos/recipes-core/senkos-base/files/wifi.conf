# Wi-Fi is loaded explicitly by `wifi on`, never by SDIO coldplug.
blacklist rtl8821cs
# Also prevent the mainline driver binding on older development images.
blacklist rtw88_8821cs
# Keep upstream's idle power saving disabled pending failure isolation.
# System suspend is separate. Reduce vendor INFO logging in normal use.
options rtl8821cs rtw_power_mgnt=0 rtw_ips_mode=0 rtw_drv_log_level=2
