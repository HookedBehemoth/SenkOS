# The slots (squashfs lz4), /uboot, /data, AppImages
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_LZ4=y
CONFIG_VFAT_FS=y
CONFIG_EXT4_FS=y
CONFIG_FUSE_FS=y
# `overlay`: /data/OS/overlay over the rootfs
CONFIG_OVERLAY_FS=y
CONFIG_ZRAM=y
CONFIG_ZRAM_BACKEND_LZ4=y
# weston.init's session cgroups
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_SCHED=y
CONFIG_FAIR_GROUP_SCHED=y
# virtio-gpu (virgl, venus), keyboard, sound, disk, network
CONFIG_DRM_VIRTIO_GPU=y
CONFIG_VIRTIO_INPUT=y
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_NET=y
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_VIRTIO=y
# senkos-qemu's pad (qemupad)
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_UINPUT=y
# senkos.init's watchdog
CONFIG_WATCHDOG=y
CONFIG_I6300ESB_WDT=y
CONFIG_CONFIGFS_FS=y
