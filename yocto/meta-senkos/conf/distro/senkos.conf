# Minimal handheld distro on plain oe-core defaults (no poky).
DISTRO = "senkos"
DISTRO_NAME = "SenkOS"
DISTRO_VERSION = "0.1"

INIT_MANAGER = "mdev-busybox"
# ...but eudev instead of mdev: libinput (Weston) only sees devices tagged by udev
VIRTUAL-RUNTIME_dev_manager = "udev"
PACKAGE_CLASSES = "package_ipk"

# Keep account ownership stable across builds and fail when a new account has no assigned ID.
USERADDEXTENSION = "useradd-staticids"
USERADD_UID_TABLES = "files/passwd"
USERADD_GID_TABLES = "files/group"
USERADD_ERROR_DYNAMIC = "error"

# oe-core's defaults are desktop-sized (ptest, debuginfod, x11, wayland, vulkan, pulseaudio, nfs, 3g, nfc...).
# opengl/vulkan: Mesa panfrost + PanVK (see below). wayland: Weston (our shell). x11: Xwayland in
# Weston for games that only speak X11, and libGL.so.1 (glvnd's GLX).
# sysvinit: only so recipes install their /etc/rc*.d links (update-rc.d.bbclass); init is still busybox.
DISTRO_FEATURES_DEFAULTS = "ext2 vfat ipv4 ipv6 wifi alsa opengl glvnd vulkan wayland x11 sysvinit"

# No package manager on the device: alternatives are resolved at image build time.
VIRTUAL-RUNTIME_update-alternatives = ""

# No SPDX SBOM generation (a create_spdx task per recipe for nothing we use)
INHERIT_DISTRO:remove = "create-spdx"

# Every recipe using alternatives build-depends on target opkg-utils (update-alternatives.bbclass).
# Its "python" config drags python3 -> openssl -> perl, sqlite3, ca-certificates into the build.
PACKAGECONFIG:pn-opkg-utils = "update-alternatives"

# GL/GLES + Vulkan through Mesa (the GPU driver: the machine's PACKAGECONFIG append); EGL/GBM on KMS, Wayland,
# and GLX for Xwayland's clients. glvnd: libOpenGL for desktop GL through EGL, libGL with GLX.
PACKAGECONFIG:pn-mesa = "gallium egl gbm gles opengl glvnd vulkan wayland x11 zlib"
GALLIUMDRIVERS_SOFTPIPE:pn-mesa = ""
# glvnd dispatches EGL/GLES/desktop GL (libOpenGL) to Mesa's vendor library
PREFERRED_PROVIDER_virtual/egl = "libglvnd"
PREFERRED_PROVIDER_virtual/libgles1 = "libglvnd"
PREFERRED_PROVIDER_virtual/libgles2 = "libglvnd"
PREFERRED_PROVIDER_virtual/libgles3 = "libglvnd"

# Hardware video decode: Cedrus (V4L2 stateless) -> GStreamer v4l2codecs -> waylandsink (or kmssink).
# Only what that pipeline needs; the recipe defaults pull pango/cairo/rsvg/curl/openssl/codecs.
# mediaplayer adds playbin, alsasink and gst-libav (FFmpeg's audio decoders, software video fallback).
PACKAGECONFIG:pn-gstreamer1.0-plugins-bad = "v4l2codecs kms wayland"
PACKAGECONFIG:pn-gstreamer1.0-plugins-good = ""
PACKAGECONFIG:pn-gstreamer1.0-plugins-base = "alsa"
LICENSE_FLAGS_ACCEPTED += "commercial_gstreamer1.0-libav"

# FFmpeg libs (libav*) for RetroArch (movie core, recording), PPSSPP and other ports. Native decoders
# only; no external codec libs, no X11/SDL outputs. The recipe carries LICENSE_FLAGS = "commercial".
LICENSE_FLAGS_ACCEPTED += "commercial_ffmpeg"
PACKAGECONFIG:pn-ffmpeg = "avdevice avfilter avcodec avformat swresample swscale alsa zlib"

# Weston: DRM backend, GL renderer, Xwayland; the shell is ours (apps/shell). Clients get Vulkan
# through Mesa's Wayland WSI.
PACKAGECONFIG:pn-weston = "kms egl xwayland"

# Launcher text: HarfBuzz shapes, FreeType rasterizes, fontconfig finds the font. None of glib/icu/cairo/png.
PACKAGECONFIG:pn-harfbuzz = "freetype"
# bzip2: ports' binaries call FT_Stream_OpenBzip2, which Debian's FreeType exports (armhf's gmloader)
PACKAGECONFIG:pn-freetype = "zlib bzip2"
PACKAGECONFIG:pn-lib32-freetype = "harfbuzz pixmap zlib bzip2"

# Audio: PipeWire owns the card, WirePlumber links the streams; ALSA's default (pipewire-alsa) and the
# Pulse socket (pipewire-pulse) lead into it.
# PipeWire's PACKAGECONFIG: its bbappend (the recipe's is per class)
# Without its dbus RDEPENDS: no session bus here
PACKAGECONFIG:pn-wireplumber = ""
# Bluetooth: audio (A2DP, AVRCP), pads (HID, HoG), bluetoothctl until the launcher pairs
PACKAGECONFIG:pn-bluez5 = "readline a2dp-profiles avrcp-profiles hid-profiles hog-profiles udev"

# armhf games' 32-bit userland: on the handhelds only (qemu.yml builds for x86-64)
include ${@'conf/distro/include/senkos-armhf.inc' if d.getVar('TARGET_ARCH') == 'aarch64' else ''}
