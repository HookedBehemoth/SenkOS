# Distro: senkos.conf, the image, userspace, and its policy on the BSP's recipes
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
# Appends to recipes of the Anbernic BSP, only with it
BBFILES_DYNAMIC += "anbernic:${LAYERDIR}/dynamic-layers/anbernic/*/*/*.bbappend"

BBFILE_COLLECTIONS += "senkos"
BBFILE_PATTERN_senkos = "^${LAYERDIR}/"
BBFILE_PRIORITY_senkos = "10"

LAYERDEPENDS_senkos = "core"
LAYERSERIES_COMPAT_senkos = "wrynose"
