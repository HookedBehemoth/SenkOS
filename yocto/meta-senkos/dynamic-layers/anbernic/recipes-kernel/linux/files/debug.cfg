# Developer builds (dev.yml): perf with the CPU's PMU, ftrace, k/uprobes, debugfs,
# /proc/config.gz, delay accounting, hung task reports
CONFIG_PERF_EVENTS=y
CONFIG_ARM_PMUV3=y
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_FUNCTION_GRAPH_TRACER=y
CONFIG_FTRACE_SYSCALLS=y
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBE_EVENTS=y
CONFIG_DEBUG_FS=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_TASKSTATS=y
CONFIG_TASK_DELAY_ACCT=y
CONFIG_DETECT_HUNG_TASK=y
CONFIG_SCHEDSTATS=y
