# watchdog daemon (anbernic-base), register/PMIC poking + RTC wake for suspend work
CONFIG_WATCHDOG=y
CONFIG_DEVMEM=y
CONFIG_I2CGET=y
CONFIG_I2CSET=y
CONFIG_I2CDUMP=y
CONFIG_I2CDETECT=y
CONFIG_RTCWAKE=y
CONFIG_TIMEOUT=y
CONFIG_POWEROFF=y
CONFIG_FEATURE_DD_STATUS=y
# Wi-Fi (anbernic-base's wifi): the clock from the network once there's a lease
CONFIG_NTPD=y
