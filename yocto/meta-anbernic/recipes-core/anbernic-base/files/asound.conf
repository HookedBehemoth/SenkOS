# Several apps at once: a paused game in the background keeps its stream
# open, and hw:0 takes only one. dmix mixes them at 48 kHz; plug converts.
pcm.!default {
	type plug
	slave.pcm "mix"
}
pcm.mix {
	type dmix
	ipc_key 2048
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		rate 48000
		format S16_LE
		channels 2
		period_size 512
		buffer_size 2048
	}
}
ctl.!default {
	type hw
	card 0
}
