# Bring-up diagnostics without UART. Drop this fragment once the board boots.
# Red status LED (PI11 = GPIO 267) on as soon as U-Boot proper runs (same as ROCKNIX).
CONFIG_LED_STATUS=y
CONFIG_LED_STATUS_GPIO=y
CONFIG_LED_STATUS0=y
CONFIG_LED_STATUS_BIT=267
CONFIG_LED_STATUS_STATE=2
# Count boots in uboot.env on the FAT boot partition: proves U-Boot ran and can write the card,
# and a count that climbs by itself means a reset loop.
CONFIG_USE_PREBOOT=y
CONFIG_PREBOOT="test -n ${dbgboots} || setenv dbgboots 0; setexpr dbgboots ${dbgboots} + 1; saveenv"
