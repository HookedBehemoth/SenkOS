; Built-in gamepad (gpio-keys-gamepad): SDL numbers its buttons in keycode order,
; BTN_SOUTH EAST NORTH WEST TL TR TL2 TR2 SELECT START MODE, DPAD_UP DOWN LEFT RIGHT = 0..14.
; Physical A sends BTN_EAST, B sends BTN_SOUTH.
[gba.input.SDLB]
keyA=1
keyB=0
keyL=4
keyR=5
keySelect=8
keyStart=9
keyUp=11
keyDown=12
keyLeft=13
keyRight=14

[ports.sdl]
fullscreen=1
lockAspectRatio=1
