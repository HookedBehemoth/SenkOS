# Handheld defaults. RetroArch copies this to /data/.config/retroarch/retroarch.cfg on first start;
# change that one (or delete it to start over). Everything lives in /data/retroarch.
video_driver = "gl"
video_fullscreen = "true"
video_vsync = "true"
input_driver = "wayland"
input_joypad_driver = "udev"
audio_driver = "alsathread"
menu_driver = "ozone"
assets_directory = "/data/retroarch/assets"

libretro_directory = "/data/retroarch/cores"
libretro_info_path = "/data/retroarch/info"
joypad_autoconfig_dir = "/data/retroarch/autoconfig"
system_directory = "/data/bios"
savefile_directory = "/data/saves"
savestate_directory = "/data/states"
screenshot_directory = "/data/screenshots"
rgui_browser_directory = "/data/roms"

# Hotkeys: hold Select + X menu, L1 load state, R1 save state, R2 fast forward. Menu quits (launcher).
input_enable_hotkey_btn = "8"
input_menu_toggle_btn = "2"
input_load_state_btn = "4"
input_save_state_btn = "5"
input_toggle_fast_forward_btn = "7"
input_exit_emulator_btn = "nul"
