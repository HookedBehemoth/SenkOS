# Built-in pad, RetroPad by label (SNES layout = the printed A/B/X/Y). udev numbers the buttons in
# keycode order: BTN_SOUTH(B) EAST(A) NORTH(X) WEST(Y) TL TR TL2 TR2 SELECT START MODE, DPAD_UP DOWN LEFT RIGHT.
# MODE (Menu) is left to the launcher: it pauses the running app (Resume/Quit).
input_driver = "udev"
input_device = "gpio-keys-gamepad"
input_device_display_name = "RG35XX-SP"
input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_up_btn = "11"
input_down_btn = "12"
input_left_btn = "13"
input_right_btn = "14"
