BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "anbernic"
BBFILE_PATTERN_anbernic = "^${LAYERDIR}/"
BBFILE_PRIORITY_anbernic = "10"

LAYERDEPENDS_anbernic = "core arm-toolchain meta-arm"
LAYERSERIES_COMPAT_anbernic = "wrynose"
