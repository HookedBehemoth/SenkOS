#@TYPE: Machine
#@NAME: Anbernic RG35XX-SP
#@DESCRIPTION: Allwinner H700 (H616 family) clamshell handheld, 1GB LPDDR4, boots from TF1

require conf/machine/include/h700.inc

MACHINE_FEATURES = "alsa usbhost usbgadget bluetooth wifi vfat ext2 rtc screen"

# ttyS0: UART pads on the board; ttyGS0: a USB ACM gadget, where the distro sets one up
SERIAL_CONSOLES = "115200;ttyS0 115200;ttyGS0"

KERNEL_DEVICETREE = " \
    allwinner/sun50i-h700-anbernic-rg35xx-sp.dtb \
    allwinner/sun50i-h700-anbernic-rg35xx-plus.dtb \
    allwinner/sun50i-h700-anbernic-rg35xx-2024.dtb \
    allwinner/sun50i-h700-anbernic-rg35xx-h.dtb \
    allwinner/sun50i-h700-anbernic-rg-sp.dtb \
    allwinner/sun50i-h700-anbernic-rg28xx.dtb \
    allwinner/sun50i-h700-anbernic-rg34xx.dtb \
    allwinner/sun50i-h700-anbernic-rg34xx-sp.dtb \
    allwinner/sun50i-h700-anbernic-rg35xx-2024-rev6-panel.dtb \
    allwinner/sun50i-h700-anbernic-rg35xx-h-rev6-panel.dtb \
    allwinner/sun50i-h700-anbernic-rg35xx-plus-rev6-panel.dtb \
    allwinner/sun50i-h700-anbernic-rg35xx-pro.dtb \
    allwinner/sun50i-h700-anbernic-rg40xx-h.dtb \
    allwinner/sun50i-h700-anbernic-rg40xx-v.dtb \
    allwinner/sun50i-h700-anbernic-rgcubexx.dtb \
"

# SPL selects LPDDR3 or LPDDR4 from the DRAM straps; both use these DTBs.
UBOOT_MACHINE = "anbernic_rg35xx_h700_defconfig"


# Wi-Fi: RTL8821CS on SDIO; vendor module includes its firmware.
# Select the recipe so the kernel's generic module provider cannot shadow it.
MACHINE_EXTRA_RRECOMMENDS += "rtl8821cs"

