#@TYPE: Machine
#@NAME: Anbernic RG35XX-SP
#@DESCRIPTION: Allwinner H700 (H616 family) clamshell handheld, 1GB LPDDR4, boots from TF1

require conf/machine/include/arm/armv8a/tune-cortexa53.inc

MACHINE_FEATURES = "alsa usbhost usbgadget wifi bluetooth vfat ext2 rtc screen"

SERIAL_CONSOLES = "115200;ttyS0"

PREFERRED_PROVIDER_virtual/kernel = "linux-anbernic"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = " \
    allwinner/sun50i-h700-anbernic-rg35xx-sp.dtb \
    allwinner/sun50i-h700-anbernic-rg35xx-sp-v2-panel.dtb \
"

# TF-A BL31 gets linked into the U-Boot SPL image
TFA_PLATFORM = "sun50i_h616"
TFA_BUILD_TARGET = "bl31"
TFA_INSTALL_TARGET = "bl31"
TFA_DEBUG = "0"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
# LPDDR4 variant; DDR3 units would need ROCKNIX's lpddr3 defconfig
UBOOT_MACHINE = "anbernic_rg35xx_h700_defconfig"
SPL_BINARY = "u-boot-sunxi-with-spl.bin"
EXTRA_IMAGEDEPENDS += "u-boot"

IMAGE_FSTYPES = "wic.zst wic.bmap"
WKS_FILE = "rg35xx-sp.wks"
# Only what rg35xx-sp.wks needs (the oe-core default also builds grub-efi, systemd-boot, cdrtools, btrfs/squashfs/erofs tools)
WKS_FILE_DEPENDS = "wic-native e2fsprogs-native dosfstools-native mtools-native bmaptool-native u-boot"
IMAGE_BOOT_FILES = "Image sun50i-h700-anbernic-rg35xx-sp.dtb sun50i-h700-anbernic-rg35xx-sp-v2-panel.dtb"
