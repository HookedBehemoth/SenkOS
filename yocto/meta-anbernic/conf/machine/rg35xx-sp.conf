#@TYPE: Machine
#@NAME: Anbernic RG35XX-SP
#@DESCRIPTION: Allwinner H700 (H616 family) clamshell handheld, 1GB LPDDR4, boots from TF1

# H700 has the ARMv8 Crypto Extensions (AES/SHA1/SHA2/PMULL): let everything use them
DEFAULTTUNE = "cortexa53-crypto"
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

MACHINE_FEATURES = "alsa usbhost usbgadget bluetooth vfat ext2 rtc screen"

# ttyS0: UART pads on the board; ttyGS0: USB ACM gadget (anbernic-base)
SERIAL_CONSOLES = "115200;ttyS0 115200;ttyGS0"

PREFERRED_PROVIDER_virtual/kernel = "linux-anbernic"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = " \
    allwinner/sun50i-h700-anbernic-rg35xx-sp.dtb \
    allwinner/sun50i-h700-anbernic-rg35xx-sp-v2-panel.dtb \
"

# TF-A BL31 gets linked into the U-Boot SPL image. 2.12 LTS: the H616 SYSTEM_SUSPEND patch
# (see trusted-firmware-a_%.bbappend) uses the pre-2.13 pwr_domain_pwr_down_wfi PSCI hook.
PREFERRED_VERSION_trusted-firmware-a = "2.12%"
TFA_PLATFORM = "sun50i_h616"
TFA_BUILD_TARGET = "bl31"
TFA_INSTALL_TARGET = "bl31"
TFA_DEBUG = "0"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
# LPDDR4 units; LPDDR3 ones need a different DRAM config
UBOOT_MACHINE = "anbernic_rg35xx_h700_defconfig"
SPL_BINARY = "u-boot-sunxi-with-spl.bin"
PREFERRED_VERSION_u-boot = "2026.07"
EXTRA_IMAGEDEPENDS += "u-boot"

# wic: whole card; squashfs-lz4: one A/B slot (also what `tools/ota` flashes)
IMAGE_FSTYPES = "wic.zst wic.bmap squashfs-lz4"
IMAGE_TYPEDEP:wic += "squashfs-lz4"
# High compression costs build time only: lz4 decompresses as fast either way
EXTRA_IMAGECMD:squashfs-lz4 = "-Xhc"
WKS_FILE = "rg35xx-sp.wks.in"
# Only what rg35xx-sp.wks needs (the oe-core default also builds grub-efi, systemd-boot, cdrtools, btrfs/squashfs/erofs tools)
WKS_FILE_DEPENDS = "wic-native e2fsprogs-native dosfstools-native mtools-native bmaptool-native u-boot"
# Kernel + dtbs live in each slot's /boot; the FAT partition only has the A/B boot script
IMAGE_BOOT_FILES = "boot.scr"
