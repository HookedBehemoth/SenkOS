<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- downloadd (root) owns org.senkos.Updates1; the launcher (shell) and root may call it, nobody else -->
<busconfig>
  <policy user="root">
    <allow own="org.senkos.Updates1"/>
    <allow send_destination="org.senkos.Updates1"/>
  </policy>
  <policy user="shell">
    <allow send_destination="org.senkos.Updates1"/>
  </policy>
</busconfig>
